<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Cart | FurEver Care</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="ticker">Your FurEver Care Shopping Cart</div>
        <header><a class="logo" href="index.html">🐾 FurEver Care</a>
            <nav>
                <a href="index.html#home">Home</a>
                <a href="index.html#products">Products</a>
                <a href="about.html">About Us</a>
                <a href="checkout.html">Checkout</a>
            </nav>
        </header>
        <main class="page-wrap">
            <div class="page-card">
                <h1>Your Cart</h1>
                <div id="cartItems"></div>
                <div class="total-box"><h2 id="total"></h2>
                    <a class="big-btn" href="checkout.html">Buy Now / Checkout</a></div>
                    <p><a class="back-link" href="index.html#products">← Continue Shopping</a></p></div></main>
                    <script src="shop.js"></script>
                    <script>function render(){let c=getCart(),box=document.getElementById('cartItems');if(!c.length){box.innerHTML='<h3>Your cart is empty.</h3><a class="big-btn" href="index.html#products">Shop Products</a>';total.textContent='';return}box.innerHTML=c.map((p,i)=>`<div class="cart-row"><div class="cart-icon">${p.icon}</div><div><b>${p.name}</b><small>${p.category}</small></div><div>PKR ${(p.price*p.qty).toLocaleString()}</div><div><button class="remove-btn" onclick="removeItem(${i})">×</button></div></div>`).join('');document.getElementById('total').textContent='Total: PKR '+c.reduce((a,p)=>a+p.price*p.qty,0).toLocaleString()}function removeItem(i){let c=getCart();c.splice(i,1);saveCart(c);render()}document.addEventListener('DOMContentLoaded',render)
                    </script>
                    </body>
                    </html>
